name: Automated Git Commit Bot

on:
  schedule:
    # Runs at 12:00 UTC every single day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to manually trigger the bot from GitHub

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push commits to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make a Modification
        run: |
          echo "Last bot update: $(date)" > bot-log.txt

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated log update [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
